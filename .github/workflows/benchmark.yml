name: Benchmark CI

on:
  push:
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system -r requirements-bench.txt

      - name: Run eviction unit tests (38 tests)
        run: |
          python -m pytest tests/unit_tests/eviction/ \
              --ignore=tests/unit_tests/eviction/test_distributed_cache.py \
              -v -o "addopts="

      - name: Run quick synthetic benchmark
        timeout-minutes: 15
        run: |
          python -u benchmarks/run_benchmarks.py \
              --dataset synthetic \
              --n_samples 1000 \
              --cache_sizes 50,100,200 \
              --policies lru,fifo,lfu,wtinylfu,wtinylfu_nocost \
              --thresholds 0.85 \
              --output results/ \
              --workers 0
